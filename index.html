<style>
:root{--bg:#f6f7f9;--card:#fff;--border:#e3e6eb;--text:#111827;--muted:#6b7280;--accent:#111827;--err:#b91c1c}

body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--text);

form{width:100%;max-width:340px;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:22px}
h1{font-size:17px;margin:0 0 14px}

label{display:flex;gap:8px;align-items:center;color:var(--muted);font-size:13px;margin:12px 0 16px}
button{width:100%;font:inherit;font-weight:600;padding:10px;border:0;border-radius:9px;background:var(--accent);color:var(--bg);cursor:pointer}
.err{color:var(--err);font-size:13px;margin-top:10px;min-height:18px}
</style>

const bytes = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function unlock(pass){
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pass), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({name:"PBKDF2", salt:bytes(SALT), iterations:ITER, hash:"SHA-256"},
    base, {name:"AES-GCM", length:256}, false, ["decrypt"]);
  const plain = await crypto.subtle.decrypt({name:"AES-GCM", iv:bytes(IV)}, key, bytes(DATA));
  const html = new TextDecoder().decode(plain);
  document.open(); document.write(html); document.close();
}
const get = k => { try { return localStorage.getItem(k); } catch(e) { return null; } };
const set = (k, v) => { try { v === null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch(e) {} };
const saved = get("notes.k");
if (saved) unlock(saved).catch(() => set("notes.k", null));
document.getElementById("f").addEventListener("submit", async e => {
  e.preventDefault();
  const pass = document.getElementById("p").value.trim();
  document.getElementById("b").textContent = "Opening…";
  try {
    if (document.getElementById("r").checked) set("notes.k", pass);
    await unlock(pass);
  } catch(err) {
    set("notes.k", null);
    document.getElementById("e").textContent = "Wrong password.";
    document.getElementById("b").textContent = "Open";
  }
});
})();
